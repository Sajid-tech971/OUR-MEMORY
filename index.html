<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PABNA PILOT SCHOOL & COLLEGE - Our Memories</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: rgba(23, 32, 54, 0.6);
            --primary: #3b82f6;
            --accent: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }

        header {
            padding: 2.5rem 1.5rem 1.5rem;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
            position: relative;
        }

        .lang-switch {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .lang-switch:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .school-title {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .sub-title {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--accent);
            font-weight: 600;
        }

        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(59, 130, 246, 0.2);
        }

        .thumb-container {
            position: relative;
            width: 100%;
            height: 220px;
            background: #1e293b;
            overflow: hidden;
        }

        .thumb-container img, .thumb-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .card:hover .thumb-container img {
            transform: scale(1.05);
        }

        .media-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            backdrop-filter: blur(5px);
        }

        .card-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-date {
            font-size: 0.85rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }

        .card-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Fullscreen Navigation Buttons */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            backdrop-filter: blur(5px);
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2010;
        }

        .nav-btn:hover {
            background: var(--primary);
        }

        .nav-prev { left: 20px; }
        .nav-next { right: 20px; }

        footer {
            text-align: center;
            padding: 2rem 1.5rem;
            border-top: 1px solid var(--glass-border);
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: auto;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s;
        }

        footer a:hover {
            color: var(--accent);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <button class="lang-switch" id="langBtn" onclick="toggleLanguage()">বাংলা</button>
        <h1 class="school-title">PABNA PILOT SCHOOL & COLLEGE</h1>
        <div class="sub-title" id="subTitle">Our Memories Archive</div>
    </header>

    <main>
        <div class="gallery-grid" id="gallery">
            <!-- Dynamic Memory Cards loaded from JS -->
        </div>
    </main>

    <footer>
        Create with ❤️ by <a href="https://sajid-tech971.github.io/MY-BIO/" target="_blank">MD SADID HASAN SAJID</a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
